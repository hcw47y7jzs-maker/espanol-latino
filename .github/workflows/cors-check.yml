name: Vérif CORS Groq
on:
  push:
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://api.groq.com/openai/v1/audio/transcriptions https://api.groq.com/openai/v1/chat/completions; do
            echo "== OPTIONS $u"
            curl -s -i -X OPTIONS "$u" -H "Origin: https://hcw47y7jzs-maker.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" | head -30
          done
          echo "== POST sans clé"
          curl -s -i -X POST https://api.groq.com/openai/v1/chat/completions -H "Origin: https://hcw47y7jzs-maker.github.io" -H "Content-Type: application/json" -d '{}' | head -30
